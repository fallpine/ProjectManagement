ackground:white;border:1px solid var(--line);border-radius:9px;padding:15px;margin-bottom:10px;overflow-wrap:anywhere}.card strong{display:block;margin:8px 0;font-size:15px}.card p{font-size:13px;margin:7px 0;color:var(--muted)}.section{background:#fff;border:1px solid var(--line);border-radius:12px;margin:18px 0;padding:22px}summary{cursor:pointer;font-weight:600}.row{border-top:1px solid var(--line);padding:16px 0;overflow-wrap:anywhere}.row:first-of-type{margin-top:16px}.empty{color:var(--muted);padding:24px 4px}.split{display:flex;align-items:center;justify-content:space-between;gap:12px}.detail-list{padding-inline-start:22px}dialog{max-width:740px;width:calc(100% - 32px);max-height:85vh;border:1px solid var(--line);border-radius:16px;padding:26px;color:inherit;overflow:auto}dialog::backdrop{background:#122b28aa}dialog h3{margin-top:20px}dialog p{white-space:pre-wrap;overflow-wrap:anywhere}.banner{background:#fff2d5;color:#74531e;padding:10px 16px;border-radius:8px;margin-bottom:16px}footer{font-size:12px;color:var(--muted);padding:14px 0 28px}.check{border-inline-start:3px solid #cbdcd3;padding:8px 12px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}label.search{flex:1}a{color:var(--accent)}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:640px){header{padding:24px}main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr}.toolbar label{flex:1;min-width:140px}.column{min-height:120px}h1{font-size:25px}}

<script>
'use strict';
const data=JSON.parse(document.getElementById('board-data').textContent);
const $=id=>document.getElementById(id), statuses=['未开始','进行中','已完成'];
const reqMap=new Map(data.requirements.map(r=>[r.id,r]));
// 所有外来文本仅通过 textContent 写入 DOM。
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function pill(text,cls=''){return el('span',text,'pill '+cls);}
function active(t){return !t.cancelled&&t.requirement_ids.every(id=>{const r=reqMap.get(id);return r.confirmation==='已确认'&&!r.cancelled;});}
function pending(t){return t.implemented&&t.status!=='已完成';}
const tasks=data.tasks.filter(active), archived=data.tasks.filter(t=>!active(t));
$('project-title').textContent=data.project.name;document.title=data.project.name+' · 开发进度';
$('project-meta').textContent=`当前阶段：${data.project.current_stage}　/　数据更新：${data.project.updated_at}`;
if(data.project.demo)$('demo').append(el('div','演示数据 · 仅用于说明看板行为，不代表任何真实 App 的开发进度。','banner'));
const done=tasks.filter(t=>t.status==='已完成').length;
const rate=tasks.length?Math.round(done/tasks.length*100):0;
for(const [label,value] of [['总体完成率',tasks.length?rate+'%':'暂无任务'],...statuses.map(s=>[s,tasks.filter(t=>t.status===s).length]),['存在阻塞',tasks.filter(t=>t.blocked_reason.trim()).length],['已实现待验证',tasks.filter(pending).length]]){
 const n=el('div',undefined,'stat');n.append(el('span',label,'muted'),el('strong',String(value)));
 if(label==='总体完成率'){const p=el('progress');p.max=100;p.value=rate;p.setAttribute('aria-label','整体完成率');n.append(p,el('small',`${done} / ${tasks.length} 个有效任务`));}$('stats').append(n);
}
for(const stage of [...new Set(tasks.map(t=>t.stage))]){const o=el('option',stage);o.value=stage;$('stage').append(o);}
for(const r of data.requirements){const o=el('option',r.id+' · '+r.title);o.value=r.id;$('requirement').append(o);}
function list(parent,title,items){parent.append(el('h3',title));if(!items.length){parent.append(el('p','无','muted'));return;}const ul=el('ul',undefined,'detail-list');items.forEach(x=>ul.append(el('li',x)));parent.append(ul);}
function showTask(t){$('detail-title').textContent=t.id+' · '+t.title;const body=$('detail-body');body.replaceChildren();body.append(pill(t.status),pill(t.stage));if(t.cancelled)body.append(pill('已取消','warn'));body.append(el('h3','实现范围'),el('p',t.scope));list(body,'关联需求',t.requirement_ids.map(id=>id+' · '+reqMap.get(id).title));list(body,'前置依赖',t.dependencies.map(id=>{const d=data.tasks.find(x=>x.id===id);return id+' · '+d.title+'（'+d.status+(active(d)?'':' / 非正式范围')+'）';}));list(body,'任务验收标准',t.acceptance_criteria);list(body,'关联需求验收标准',t.requirement_ids.flatMap(id=>reqMap.get(id).acceptance_criteria.map(c=>id+'：'+c)));body.append(el('h3','实现与验收'),el('p',`实现：${t.implemented?'已实现':'未实现'}\n验收：${t.acceptance_result}\n依据：${t.acceptance_evidence||'尚未记录'}`));list(body,'必要验证类别',t.required_checks);body.append(el('h3','实际验证记录'));if(!t.verification.length)body.append(el('p','尚未记录','muted'));for(const c of t.verification)body.append(el('div',`${c.category} · ${c.result}\n${c.evidence||'待补充依据'}\n${c.checked_at||'尚未验证'}`,'check'));for(const c of t.required_checks.filter(c=>!t.verification.some(v=>v.category===c)))body.append(el('div',c+' · 缺少记录，待验证','check'));body.append(el('h3','阻塞原因'),el('p',t.blocked_reason||'无'));list(body,'未完成事项',t.remaining_items);list(body,'任务历史',t.history.map(h=>`${h.at} · ${h.status} · ${h.note}`));$('detail').showModal();}
function card(t){const b=el('button',undefined,'card');b.type='button';b.append(el('small',t.id+' / '+t.stage),el('strong',t.title),el('p',t.scope));for(const id of t.requirement_ids)b.append(pill(id));if(t.blocked_reason.trim())b.append(pill('阻塞','warn'));if(pending(t))b.append(pill('已实现 · 待验证','info'));if(t.status==='已完成')b.append(pill('验收通过','good'));b.append(el('p','查看详情 →'));b.addEventListener('click',()=>showTask(t));return b;}
function render(){const q=$('search').value.trim().toLocaleLowerCase();const visible=tasks.filter(t=>(!$('stage').value||t.stage===$('stage').value)&&(!$('requirement').value||t.requirement_ids.includes($('requirement').value))&&(!$('status').value||t.status===$('status').value)&&[t.id,t.title,t.scope,t.blocked_reason,...t.requirement_ids.map(id=>id+' '+reqMap.get(id).title)].join(' ').toLocaleLowerCase().includes(q));$('filter-count').textContent=`显示 ${visible.length} / ${tasks.length} 个正式任务`;$('board').replaceChildren();for(const s of statuses){const col=el('section',undefined,'column'),h=el('h3');const selected=visible.filter(t=>t.status===s);h.append(el('span',undefined,'dot'),document.createTextNode(s+' · '+selected.length));col.append(h);selected.forEach(t=>col.append(card(t)));if(!selected.length)col.append(el('p','暂无任务','empty'));$('board').append(col);}}
for(const id of ['search','stage','requirement','status'])$(id).addEventListener(id==='search'?'input':'change',render);
$('reset').addEventListener('click',()=>{for(const id of ['search','stage','requirement','status'])$(id).value='';render();});
$('close').addEventListener('click',()=>$('detail').close());
for(const r of data.requirements){const row=el('details',undefined,'row'),summary=el('summary');summary.append(document.createTextNode(r.id+' · '+r.title+' '),pill(r.cancelled?'已取消':r.confirmation,r.cancelled?'warn':''));row.append(summary,el('p',r.scope));list(row,'验收标准',r.acceptance_criteria);const linked=data.tasks.filter(t=>t.requirement_ids.includes(r.id));if(!linked.length)row.append(el('p','尚未拆分任务','muted'));linked.forEach(t=>{const b=el('button',t.id+' · '+t.title+' / '+t.status+(active(t)?'':' / 不计入进度'));b.addEventListener('click',()=>showTask(t));row.append(b,el('br'));});$('requirements').append(row);}
if(!data.requirements.length)$('requirements').append(el('p','尚无需求。请先确认产品范围，再由 AI 拆分任务。','empty'));
$('archive-title').textContent=`待确认与取消任务 · ${archived.length}`;for(const t of archived){const row=el('div',undefined,'row');row.append(pill(t.cancelled||t.requirement_ids.some(id=>reqMap.get(id).cancelled)?'已取消或关联需求已取消':'关联需求待确认','warn'),card(t));$('archive').append(row);}if(!archived.length)$('archive').append(el('p','暂无记录','muted'));
